<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Fragewürfel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Nunito+Sans:wght@400;600;700&display=swap">
<script src="https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js"></script>
<style>
:root{
  --bg:#e9f0fb; --table:#1f5fae; --table-deep:#153f7a; --ivory:#ffffff;
  --fg:#10213d; --muted:#51627f; --line:#cfdbee; --card:#ffffff; --accent:#1d63d8; --accent-fg:#ffffff;
  --star:#f2b416; --cat:#2b3446; --chip:#dbe6f7; --bad:#c2261d; --on-table:#e4eeff;
  --display:"Bricolage Grotesque",ui-rounded,system-ui,sans-serif;
  --body:"Nunito Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0c1426; --table:#1b4f94; --table-deep:#112f5c; --ivory:#f4f7ff;
  --fg:#e5ecf9; --muted:#9aabc8; --line:#22314f; --card:#131e36; --accent:#4f8ff7; --accent-fg:#06122a;
  --chip:#1c2a47; --bad:#ff8a80; color-scheme:dark}}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.5}
[hidden]{display:none!important}
.wrap{max-width:560px;margin:0 auto;padding-block:24px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:18px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
h1{font-family:var(--display);font-weight:800;font-size:2rem;margin:0;letter-spacing:-.02em;color:var(--accent)}
h2{font-family:var(--display);font-size:1.2rem;margin:0}
button{font:700 1rem var(--body);border:0;border-radius:12px;padding:12px 22px;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.primary{background:var(--accent);color:var(--accent-fg)}
.light{background:#ffffff;color:#1d4fa8}
.quiet{background:var(--chip);color:var(--fg)}
button:disabled{opacity:.45;cursor:not-allowed}
input,textarea{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 12px;width:100%;min-width:0}
textarea{min-height:84px;resize:vertical}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 20px;display:grid;gap:12px}
.label{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.big{font-family:var(--display);font-weight:600;font-size:1.3rem;line-height:1.3;margin:0}
.or{text-align:center;color:var(--muted);font-size:.9rem}
.row{display:flex;gap:8px}
.code{font-family:var(--display);font-weight:800;font-size:2.6rem;letter-spacing:.15em;text-align:center;margin:0;color:var(--accent)}
.err{color:var(--bad);font-weight:700;margin:0}
.players{display:flex;gap:8px;flex-wrap:wrap}
.pl{padding:6px 12px;border-radius:999px;background:var(--chip);font-weight:700;font-size:.9rem}
.pl.on{background:var(--accent);color:var(--accent-fg)}
.mat{background:radial-gradient(circle at 50% 35%,var(--table),var(--table-deep));border-radius:20px;padding:24px 16px 20px;display:grid;justify-items:center;gap:14px}
.turn{color:#fff;font-family:var(--display);font-weight:800;font-size:1.4rem;margin:0;text-align:center}
.die{width:120px;height:120px;background:var(--ivory);border-radius:22px;box-shadow:0 6px 0 rgba(0,0,0,.28);display:grid;place-items:center}
.die svg{width:76px;height:76px}
.die.rolling{animation:roll .6s cubic-bezier(.3,.7,.4,1)}
@keyframes roll{0%{transform:rotate(0) scale(1)}40%{transform:rotate(200deg) scale(.85)}100%{transform:rotate(360deg) scale(1)}}
@media (prefers-reduced-motion:reduce){.die.rolling{animation:none}}
.legend{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;color:var(--on-table);font-size:.82rem}
.legend span{display:flex;align-items:center;gap:6px}
.legend svg{width:18px;height:18px;background:var(--ivory);border-radius:5px;padding:2px}
.log{list-style:none;margin:0;padding:0;display:grid}
.log>li{border-bottom:1px solid var(--line);padding:12px 0;display:grid;gap:4px;min-width:0}
.meta{font-size:.8rem;color:var(--muted)}
.q{font-weight:700;overflow-wrap:anywhere}
.answers{list-style:none;margin:2px 0 0;padding:0 0 0 10px;border-left:3px solid var(--line);display:grid;gap:3px;overflow-wrap:anywhere}
.muted{color:var(--muted)}
.jk{opacity:.8;font-weight:600;margin-left:4px}
.jokerRow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Fragewürfel</h1>
    <span class="label" id="codeTag"></span>
  </header>

  <p class="err" id="lostBar" hidden></p>

  <!-- Start -->
  <section class="card" id="startScreen">
    <label class="label" for="nameInput">Dein Name</label>
    <input id="nameInput" maxlength="20" placeholder="z.B. Mia" autocomplete="off">
    <button class="primary" id="createBtn" type="button">Neues Spiel erstellen</button>
    <div class="or">oder mit Code beitreten</div>
    <div class="row">
      <input id="codeInput" maxlength="4" placeholder="CODE" autocomplete="off" style="text-transform:uppercase;letter-spacing:.2em;font-weight:700" aria-label="Spiel-Code">
      <button class="quiet" id="joinBtn" type="button">Beitreten</button>
    </div>
    <p class="err" id="startErr" hidden></p>
  </section>

  <!-- Verbinden -->
  <section class="card" id="waitScreen" hidden>
    <p class="big" id="waitText">Verbinde …</p>
  </section>

  <!-- Lobby -->
  <section class="card" id="lobby" hidden>
    <div class="label">Euer Spiel-Code</div>
    <p class="code" id="lobbyCode"></p>
    <p class="muted" style="margin:0">Schick diesen Code deinen Freunden. Sie öffnen die gleiche Webseite und tippen ihn bei „Beitreten“ ein.</p>
    <div class="label">Im Spiel</div>
    <div class="players" id="lobbyPlayers"></div>
    <button class="primary" id="startGameBtn" type="button" hidden>Spiel starten</button>
    <p class="muted" id="lobbyHint" style="margin:0"></p>
  </section>

  <!-- Spiel -->
  <div id="game" hidden style="display:grid;gap:18px">
    <div class="players" id="players"></div>
    <section class="mat" aria-label="Würfeltisch">
      <p class="turn" id="turn"></p>
      <div class="die" id="die" role="img" aria-label="Würfel"></div>
      <button class="light" id="rollBtn" type="button">Würfeln</button>
      <div class="legend" id="legend"></div>
    </section>
    <section class="card" id="step" aria-live="polite"></section>
    <section>
      <h2 style="margin-bottom:6px">Fragen und Antworten</h2>
      <ul class="log" id="log"></ul>
    </section>
  </div>
</div>

<script>
const ICON={
  star:'<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="var(--star)" stroke="#b47f0c" stroke-width=".8" d="M12 2.2l2.9 6.2 6.8.8-5 4.6 1.4 6.7L12 17.1l-6.1 3.4 1.4-6.7-5-4.6 6.8-.8z"/></svg>',
  cat:'<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="var(--cat)" d="M4 3l4 4.2c1.2-.4 2.6-.6 4-.6s2.8.2 4 .6L20 3v8.5c0 4.6-3.6 8.5-8 8.5s-8-3.9-8-8.5z"/><circle cx="9" cy="12" r="1.3" fill="#e9c94a"/><circle cx="15" cy="12" r="1.3" fill="#e9c94a"/><path d="M11 15h2l-1 1z" fill="#e8a0a8"/></svg>',
  empty:'<svg viewBox="0 0 24 24" aria-hidden="true"></svg>'
};
// 6 Seiten: 1 Stern, 2 Katzen, 3 leer
const FACES=["star","cat","cat","empty","empty","empty"];
const FNAME={star:"Stern",cat:"Katze",empty:"Leer"};
const JOKERS=2; // Joker pro Person und Spiel
const LETTERS="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
// Öffentliche Nachrichten-Server (laufen über normales Internet, kein WLAN-Problem)
const BROKERS=["wss://broker.emqx.io:8084/mqtt","wss://broker.hivemq.com:8884/mqtt"];
const TOPIC="fragewuerfel-ch/v2/";

const $=id=>document.getElementById(id);
const el=(tag,props={},kids=[])=>{const e=Object.assign(document.createElement(tag),props);kids.forEach(k=>e.append(k));return e};
$("legend").innerHTML='<span>'+ICON.star+'1× Stern = Frage</span><span>'+ICON.cat+'2× Katze = nochmal</span><span>'+ICON.empty+'3× leer = nächster</span><span>🃏 2 Joker = Frage auslassen</span>';

function rid(n){let s="";for(let i=0;i<n;i++)s+=LETTERS[Math.floor(Math.random()*LETTERS.length)];return s}
let myId=null;
try{myId=localStorage.getItem("fw-id")}catch(_){}
if(!myId){myId=rid(12);try{localStorage.setItem("fw-id",myId)}catch(_){}}
try{$("nameInput").value=localStorage.getItem("fw-name")||""}catch(_){}

let client=null, code="", myName="", isHost=false, S=null, lastRoll=-1, emptyTimer=null, joinTimer=null, aliveTimer=null, lastAlive=0, gotState=false;

function show(screen){["startScreen","waitScreen","lobby","game"].forEach(id=>$(id).hidden=id!==screen)}
function stopAll(){
  [joinTimer,aliveTimer].forEach(t=>t&&clearInterval(t));joinTimer=aliveTimer=null;
  if(client){try{client.end(true)}catch(_){}client=null}
  S=null;isHost=false;gotState=false;$("lostBar").hidden=true;$("codeTag").textContent="";
}
function startError(msg){stopAll();show("startScreen");$("startErr").textContent=msg;$("startErr").hidden=false}
function getName(){
  const n=$("nameInput").value.trim();
  if(!n){startError("Bitte gib zuerst deinen Namen ein.");return null}
  try{localStorage.setItem("fw-name",n)}catch(_){}
  return n.slice(0,20);
}

/* ---------- Verbindung ---------- */
function connect(onReady,i=0){
  if(typeof mqtt==="undefined"){startError("Die Seite konnte nicht ganz laden. Prüfe dein Internet und lade neu.");return}
  if(i>=BROKERS.length){startError("Keine Verbindung zum Spiel-Server. Prüfe dein Internet und versuch es nochmal.");return}
  let ready=false;
  const c=mqtt.connect(BROKERS[i],{clientId:"fw_"+myId+"_"+rid(4),clean:true,reconnectPeriod:2000,connectTimeout:8000,keepalive:20});
  const fail=setTimeout(()=>{if(!ready){try{c.end(true)}catch(_){}connect(onReady,i+1)}},9000);
  c.on("connect",()=>{
    $("lostBar").hidden=true;
    if(ready){resubscribe();if(isHost)publishState();return}
    ready=true;clearTimeout(fail);client=c;onReady();
  });
  c.on("offline",()=>{if(ready){$("lostBar").textContent="Verbindung unterbrochen. Verbinde neu …";$("lostBar").hidden=false}});
  c.on("message",onMessage);
}
function resubscribe(){
  if(!client)return;
  client.subscribe(TOPIC+code+"/state",{qos:1});
  client.subscribe(TOPIC+code+"/alive",{qos:0});
  if(isHost)client.subscribe(TOPIC+code+"/act",{qos:1});
}
function onMessage(topic,buf){
  let msg;try{msg=JSON.parse(buf.toString())}catch(_){return}
  if(!msg||typeof msg!=="object")return;
  const t=topic.slice((TOPIC+code+"/").length);
  if(t==="alive"){lastAlive=Date.now();return}
  if(t==="state"){
    if(isHost&&gotState)return; // Host ist selbst die Quelle
    if(!msg.players)return;
    gotState=true;S=msg;lastAlive=Date.now();
    if(S.hostId===myId&&!isHost){becomeHost();return}
    render();return;
  }
  if(t==="act"&&isHost&&S){act(String(msg.from||""),msg)}
}

/* ---------- Spiel erstellen (Host) ---------- */
function createGame(){
  const name=getName();if(!name)return;
  stopAll();myName=name;$("startErr").hidden=true;show("waitScreen");$("waitText").textContent="Spiel wird erstellt …";
  code=rid(4);
  connect(()=>{
    S={hostId:myId,players:[{id:myId,name}],started:false,turn:0,phase:"roll",face:null,rollId:0,q:null,log:[],v:0};
    gotState=true;becomeHost();
  });
}
function becomeHost(){
  isHost=true;resubscribe();publishState();
  if(!aliveTimer)aliveTimer=setInterval(()=>{if(client&&client.connected)client.publish(TOPIC+code+"/alive","{}",{qos:0})},4000);
}
function publishState(){
  if(!S)return;
  S.v=(S.v||0)+1;
  if(client)client.publish(TOPIC+code+"/state",JSON.stringify(S),{qos:1,retain:true});
  render();
}

/* ---------- Beitreten (Gast) ---------- */
function joinGame(){
  const name=getName();if(!name)return;
  const c=$("codeInput").value.trim().toUpperCase();
  if(c.length!==4){startError("Der Code hat 4 Zeichen.");return}
  stopAll();myName=name;code=c;$("startErr").hidden=true;show("waitScreen");$("waitText").textContent="Verbinde mit "+c+" …";
  connect(()=>{
    resubscribe();
    setTimeout(()=>{if(!gotState)startError("Diesen Code gibt es nicht. Prüfe ihn nochmal.")},8000);
    joinTimer=setInterval(guestTick,3000);guestTick();
  });
}
function guestTick(){
  if(!client||isHost)return;
  if(S&&!S.players.find(p=>p.id===myId)){
    client.publish(TOPIC+code+"/act",JSON.stringify({t:"join",from:myId,name:myName}),{qos:1});
  }
  if(S&&Date.now()-lastAlive>15000){
    $("lostBar").textContent="Warte auf "+(nameOf(S.hostId))+". Das Spiel geht weiter, sobald sie oder er die Seite wieder offen hat.";
    $("lostBar").hidden=false;
  } else if(client.connected) $("lostBar").hidden=true;
}

function send(msg){
  msg.from=myId;
  if(isHost)act(myId,msg);
  else if(client)client.publish(TOPIC+code+"/act",JSON.stringify(msg),{qos:1});
}

/* ---------- Spielregeln (nur der Host führt sie aus) ---------- */
function curId(){return S.players[S.turn]&&S.players[S.turn].id}
function nameOf(id){const p=S&&S.players.find(p=>p.id===id);return p?p.name:"Jemand"}
function nextTurn(){S.turn=(S.turn+1)%S.players.length;S.phase="roll";S.face=null;S.q=null}
function checkAnswersDone(){if(S.q&&S.phase==="answer"&&S.q.waiting.length===0)S.phase="done"}
function act(id,msg){
  if(msg.t==="join"){
    if(!S.players.find(p=>p.id===id)&&S.players.length<10){
      S.players.push({id,name:String(msg.name||"Gast").slice(0,20),jokers:JOKERS});
      if(S.q&&S.phase==="answer"&&S.q.from!==id)S.q.waiting.push(id);
      publishState();
    }
    return;
  }
  if(!S.players.find(p=>p.id===id))return;
  if(msg.t==="start"&&id===myId&&S.players.length>=2){S.started=true;S.players.forEach(p=>p.jokers=JOKERS);S.turn=0;S.phase="roll";S.face=null;S.q=null;S.log=[];publishState();return}
  if(!S.started)return;
  if(msg.t==="roll"&&id===curId()&&(S.phase==="roll"||S.phase==="again")){
    S.face=FACES[Math.floor(Math.random()*6)];S.rollId++;
    S.phase=S.face==="star"?"ask":S.face==="cat"?"again":"empty";
    publishState();
    if(S.phase==="empty"){clearTimeout(emptyTimer);const r=S.rollId;emptyTimer=setTimeout(()=>{if(S&&S.rollId===r&&S.phase==="empty"){nextTurn();publishState()}},2500)}
    return;
  }
  if(msg.t==="ask"&&id===curId()&&S.phase==="ask"){
    const text=String(msg.text||"").trim().slice(0,300);if(!text)return;
    S.q={from:id,fromName:nameOf(id),text,answers:[],waiting:S.players.filter(p=>p.id!==id).map(p=>p.id)};
    S.phase="answer";checkAnswersDone();publishState();return;
  }
  if(msg.t==="answer"&&S.phase==="answer"&&S.q&&S.q.waiting.includes(id)){
    const text=String(msg.text||"").trim().slice(0,300);if(!text)return;
    S.q.answers.push({name:nameOf(id),text});S.q.waiting=S.q.waiting.filter(w=>w!==id);
    checkAnswersDone();publishState();return;
  }
  if(msg.t==="joker"&&S.phase==="answer"&&S.q&&S.q.waiting.includes(id)){
    const p=S.players.find(p=>p.id===id);
    if(!p||!(p.jokers>0))return;
    p.jokers--;
    S.q.answers.push({name:p.name,text:"🃏 Joker eingesetzt",joker:true});S.q.waiting=S.q.waiting.filter(w=>w!==id);
    checkAnswersDone();publishState();return;
  }
  if(msg.t==="next"&&(id===curId()||id===S.hostId)&&S.phase==="done"){
    S.log.unshift({fromName:S.q.fromName,text:S.q.text,answers:S.q.answers});
    if(S.log.length>30)S.log.length=30;
    nextTurn();publishState();return;
  }
  if(msg.t==="skip"&&id===S.hostId&&id!==curId()){
    if(S.q&&S.q.answers.length)S.log.unshift({fromName:S.q.fromName,text:S.q.text,answers:S.q.answers});
    nextTurn();publishState();return;
  }
}

/* ---------- Anzeige ---------- */
function render(){
  if(!S)return;
  $("codeTag").textContent="Code "+code;
  if(!S.started){
    show("lobby");
    $("lobbyCode").textContent=code;
    const lp=$("lobbyPlayers");lp.innerHTML="";
    S.players.forEach(p=>lp.append(el("span",{className:"pl",textContent:p.name+(p.id===myId?" (du)":"")})));
    $("startGameBtn").hidden=!isHost;
    $("startGameBtn").disabled=S.players.length<2;
    const inList=S.players.find(p=>p.id===myId);
    $("lobbyHint").textContent=isHost?(S.players.length<2?"Warte, bis mindestens eine Person beitritt.":"Alle da? Dann starte das Spiel."):(inList?"Du bist drin! Warte, bis das Spiel gestartet wird.":"Du wirst hinzugefügt …");
    return;
  }
  show("game");
  const pl=$("players");pl.innerHTML="";
  S.players.forEach((p,i)=>pl.append(el("span",{className:"pl"+(i===S.turn?" on":""),textContent:p.name+(p.id===myId?" (du)":""),title:(p.jokers||0)+" Joker übrig"},[el("span",{className:"jk",textContent:"🃏"+(p.jokers||0)})])));
  const myTurn=curId()===myId;
  const curName=nameOf(curId());
  $("turn").textContent=myTurn?"Du bist dran!":curName+" ist dran";
  const d=$("die");
  d.innerHTML=ICON[S.face||"star"];d.setAttribute("aria-label","Würfel zeigt "+FNAME[S.face||"star"]);
  if(S.rollId!==lastRoll){if(lastRoll!==-1&&S.face){d.classList.remove("rolling");void d.offsetWidth;d.classList.add("rolling")}lastRoll=S.rollId}
  $("rollBtn").hidden=!myTurn;
  $("rollBtn").disabled=!(S.phase==="roll"||S.phase==="again");
  $("rollBtn").textContent=S.phase==="again"?"Nochmal würfeln":"Würfeln";
  renderStep(myTurn,curName);renderLog();
}

function renderStep(myTurn,curName){
  const box=$("step");
  const fid=document.activeElement&&document.activeElement.id;
  const keep=(fid==="qInput"||fid==="aInput")?$(fid).value:"";
  box.innerHTML="";
  const add=(lab,txt)=>box.append(el("div",{className:"label",textContent:lab}),el("p",{className:"big",textContent:txt}));
  if(S.phase==="roll")add("Jetzt dran",myTurn?"Würfle!":"Warte, bis "+curName+" würfelt.");
  if(S.phase==="again")add("Katze",myTurn?"Du darfst nochmal würfeln!":curName+" darf nochmal würfeln.");
  if(S.phase==="empty")add("Leer",(myTurn?"Diesmal nichts.":curName+" hat nichts.")+" Gleich ist der Nächste dran …");
  if(S.phase==="ask"){
    add("Stern!",myTurn?"Du darfst eine Frage an alle stellen.":curName+" schreibt gerade eine Frage …");
    if(myTurn)box.append(textForm("qInput","Schreib deine Frage …","Frage senden",t=>send({t:"ask",text:t}),fid==="qInput"?keep:""));
  }
  if(S.phase==="answer"||S.phase==="done"){
    add(S.q.fromName+" fragt",S.q.text);
    if(S.q.answers.length){
      const ul=el("ul",{className:"answers"});
      S.q.answers.forEach(a=>ul.append(el("li",{},[el("b",{textContent:a.name+": "}),document.createTextNode(a.text)])));
      box.append(ul);
    }
    const iMustAnswer=S.phase==="answer"&&S.q.waiting.includes(myId);
    if(iMustAnswer){
      box.append(textForm("aInput","Deine Antwort …","Antwort senden",t=>send({t:"answer",text:t}),fid==="aInput"?keep:""));
      const me=S.players.find(p=>p.id===myId),left=(me&&me.jokers)||0;
      const jb=el("button",{type:"button",className:"quiet",textContent:"🃏 Joker einsetzen",disabled:left<1});
      jb.onclick=()=>{jb.disabled=true;send({t:"joker"})};
      box.append(el("div",{className:"jokerRow"},[jb,el("span",{className:"muted",textContent:left===1?"Noch 1 Joker übrig":"Noch "+left+" Joker übrig"})]));
    }
    else if(S.phase==="answer")box.append(el("p",{className:"muted",textContent:"Warte auf: "+S.q.waiting.map(nameOf).join(", ")}));
    if(S.phase==="done"&&(myTurn||isHost)){
      const b=el("button",{type:"button",className:"primary",textContent:"Weiter zum Nächsten"});
      b.onclick=()=>send({t:"next"});box.append(b);
    } else if(S.phase==="answer"&&!iMustAnswer)box.append(el("p",{className:"muted",textContent:"Es geht erst weiter, wenn alle geantwortet haben."}));
    else if(S.phase==="done")box.append(el("p",{className:"muted",textContent:"Alle haben geantwortet. "+curName+" macht weiter."}));
  }
  if(isHost&&!myTurn&&(S.phase==="roll"||S.phase==="again"||S.phase==="ask")){
    const s=el("button",{type:"button",className:"quiet",textContent:curName+" überspringen"});
    s.onclick=()=>send({t:"skip"});box.append(s);
  }
}
function textForm(id,ph,btnText,onSend,value){
  const ta=el("textarea",{id,maxLength:300,placeholder:ph,value:value||""});
  ta.setAttribute("aria-label",ph);
  const b=el("button",{type:"submit",className:"primary",textContent:btnText,disabled:!(value||"").trim()});
  ta.oninput=()=>{b.disabled=!ta.value.trim()};
  const f=el("form",{},[ta,b]);f.style.cssText="display:grid;gap:10px";
  f.onsubmit=e=>{e.preventDefault();const t=ta.value.trim();if(t){b.disabled=true;b.textContent="Gesendet …";onSend(t)}};
  if(value)setTimeout(()=>{ta.focus();ta.setSelectionRange(ta.value.length,ta.value.length)},0);
  return f;
}
function renderLog(){
  const ul=$("log");ul.innerHTML="";
  if(!S.log.length){ul.append(el("li",{className:"muted",textContent:"Noch keine Fragen. Wer einen Stern würfelt, darf fragen."}));return}
  for(const q of S.log){
    const ans=el("ul",{className:"answers"});
    if(!q.answers.length)ans.append(el("li",{className:"muted",textContent:"Keine Antworten"}));
    q.answers.forEach(a=>ans.append(el("li",{},[el("b",{textContent:a.name+": "}),document.createTextNode(a.text)])));
    ul.append(el("li",{},[el("div",{className:"meta",textContent:q.fromName+" fragt"}),el("div",{className:"q",textContent:q.text}),ans]));
  }
}

document.addEventListener("visibilitychange",()=>{
  if(document.visibilityState==="visible"&&client){
    if(!client.connected){try{client.reconnect()}catch(_){}}
    else if(isHost)publishState();
  }
});
$("createBtn").onclick=createGame;
$("joinBtn").onclick=joinGame;
$("codeInput").addEventListener("keydown",e=>{if(e.key==="Enter")joinGame()});
$("startGameBtn").onclick=()=>send({t:"start"});
$("rollBtn").onclick=()=>send({t:"roll"});
</script>
</body>
